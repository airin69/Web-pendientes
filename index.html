<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LUMA | Piezas de Autor</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-main: #fbf8fc;
            --bg-card: #f3ecf7;
            --bg-card-hover: #eadef2;
            --surface-glass: rgba(251, 248, 252, 0.85);
            --ink: #2a2230;
            --ink-muted: #6e6275;
            --lilac-accent: #8b68aa;
            --lilac-soft: #cdb9e3;
            --lilac-pale: #e6dbf1;
            --border-subtle: rgba(139, 104, 170, 0.15);
            --shadow-hover: 0 25px 50px rgba(139, 104, 170, 0.15);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Jost', sans-serif;
            background-color: var(--bg-main);
            color: var(--ink);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, .logo {
            font-family: 'Fraunces', serif;
            font-weight: 300;
        }

        /* HEADER */
        header {
            height: 80px;
            padding: 0 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--surface-glass);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-subtle);
        }

        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo {
            font-size: 26px;
            letter-spacing: 7px;
            text-transform: uppercase;
        }

        .logo-charm {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--lilac-accent);
        }

        nav a {
            text-decoration: none;
            color: var(--ink-muted);
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-left: 20px;
        }

        /* HERO */
        .hero {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 20px;
        }

        .hero h1 {
            font-size: clamp(56px, 9vw, 110px);
            letter-spacing: 10px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 16px;
            color: var(--ink-muted);
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        /* SECCIONES */
        section {
            padding: 80px 8%;
        }

        .section-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-title span {
            color: var(--lilac-accent);
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .section-title h2 {
            font-size: 38px;
        }

        /* CATALOGO */
        .collection-group {
            margin-bottom: 60px;
        }

        .group-header {
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        .collection {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1000px;
            margin: auto;
        }

        .product {
            text-align: center;
            position: relative;
        }

        .product-card {
            height: 380px;
            width: 100%;
            background: var(--bg-card);
            border-radius: 180px 180px 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-subtle);
            transition: transform 0.3s ease;
        }

        .product-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product:hover .product-card {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
        }

        .fav-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--surface-glass);
            border: 1px solid var(--border-subtle);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            color: var(--ink-muted);
            z-index: 2;
        }

        .fav-btn.active {
            color: #d9534f;
            border-color: #d9534f;
        }

        .product h4 {
            font-size: 18px;
            font-family: 'Fraunces', serif;
        }

        .product p {
            color: var(--lilac-accent);
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        footer {
            background-color: var(--ink);
            color: var(--bg-main);
            text-align: center;
            padding: 40px 20px;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo-wrap">
            <div class="logo">LUMA</div>
            <div class="logo-charm"></div>
        </div>

        <nav>
            <a href="#coleccion">Colección</a>
            <a href="#taller">El Taller</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>LUMA</h1>
            <p>Piezas de autor hechas a mano en arcilla polimérica.</p>
        </section>

        <section id="coleccion">
            <div class="section-title">
                <span>Catálogo</span>
                <h2>Primera Edición</h2>
            </div>

            <div class="collection-group">
                <div class="group-header">
                    <h3>Colección Violeta & Oro</h3>
                </div>

                <div class="collection">
                    <!-- Pieza 1: Arco Dúo -->
                    <div class="product" data-id="1">
                        <div class="product-card">
                            <button class="fav-btn" onclick="toggleFav(1)">♥</button>
                            <!-- Sustituye el nombre del archivo por tu foto real -->
                            <img src="IMG_9215.jpg" alt="Pendientes Arco Violeta">
                        </div>
                        <h4>Arco Dúo</h4>
                        <p>Pieza Única</p>
                    </div>

                    <!-- Pieza 2: Rombo Mármol -->
                    <div class="product" data-id="2">
                        <div class="product-card">
                            <button class="fav-btn" onclick="toggleFav(2)">♥</button>
                            <!-- Sustituye el nombre del archivo por tu foto real -->
                            <img src="IMG_9216.jpg" alt="Pendientes Rombo Mármol">
                        </div>
                        <h4>Rombo Mármol</h4>
                        <p>Pieza Única</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="logo">LUMA</div>
        <p>Modelado artesanal</p>
    </footer>

    <script>
        let favorites = JSON.parse(localStorage.getItem('luma_favs')) || [];

        function updateFavUI() {
            document.querySelectorAll('.product').forEach(el => {
                const id = parseInt(el.getAttribute('data-id'));
                const btn = el.querySelector('.fav-btn');
                if (favorites.includes(id)) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        function toggleFav(id) {
            if (favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('luma_favs', JSON.stringify(favorites));
            updateFavUI();
        }

        updateFavUI();
    </script>
</body>
</html>
