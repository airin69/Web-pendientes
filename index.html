<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NUMA</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #faf7f4;
            color: #333;
        }

        header {
            padding: 25px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #fff;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        nav a {
            margin-left: 25px;
            text-decoration: none;
            color: #333;
        }

        .hero {
            min-height: 70vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }

        .hero h1 {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 20px;
            color: #666;
        }

        .boton {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 28px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 30px;
        }

        section {
            padding: 80px 10%;
            text-align: center;
        }

        footer {
            padding: 30px;
            text-align: center;
            background-color: #fff;
            color: #777;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">NUMA</div>

        <nav>
            <a href="#inicio">Inicio</a>
            <a href="#coleccion">Colección</a>
            <a href="#sobre-mi">Sobre mí</a>
        </nav>
    </header>

    <main>

        <section class="hero" id="inicio">
            <div>
                <h1>Próximamente</h1>

                <p>
                    Pendientes hechos a mano,
                    creados poquito a poquito.
                </p>

                <a href="#coleccion" class="boton">
                    Descubrir
                </a>
            </div>
        </section>

        <section id="coleccion">
            <h2>La colección</h2>

            <p>
                Estoy preparando los primeros diseños.
                Muy pronto estarán aquí.
            </p>
        </section>

        <section id="sobre-mi">
            <h2>Sobre el proyecto</h2>

            <p>
                Un pequeño proyecto creativo hecho a mano,
                empezando desde cero.
            </p>
        </section>

    </main>

    <footer>
        © 2026 · NUMA
    </footer>

</body>
</html>
