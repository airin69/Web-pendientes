<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NUMA | Pendientes hechos a mano</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,450;0,9..144,600;1,9..144,450&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --beige: #f1e7d2;
            --beige-deep: #e6d7b8;
            --khaki: #8c8a56;
            --khaki-soft: #cfceac;
            --lilac: #cdb9e3;
            --lilac-deep: #a483c9;
            --lilac-pale: #e6dbf1;
            --ink: #33301f;
            --ink-soft: #6b6852;
            --gold: #b6996e;
        }

        html {
            scroll-behavior: smooth;
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }
            * {
                animation-duration: 0.001ms !important;
                transition-duration: 0.001ms !important;
            }
        }

        body {
            font-family: 'Jost', sans-serif;
            background-color: var(--beige);
            color: var(--ink);
        }

        h1, h2, .logo {
            font-family: 'Fraunces', serif;
        }

        a {
            color: inherit;
        }

        /* ---------- NAVEGACIÓN ---------- */

        header {
            height: 90px;
            padding: 0 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #faf5e9;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid var(--beige-deep);
        }

        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 4px;
        }

        .logo-charm {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background-color: var(--lilac-deep);
            position: relative;
            top: 9px;
        }

        .logo-charm::before {
            content: "";
            position: absolute;
            top: -8px;
            left: 3px;
            width: 1px;
            height: 8px;
            background-color: var(--ink-soft);
        }

        nav {
            display: flex;
            align-items: center;
            gap: 34px;
        }

        nav a {
            text-decoration: none;
            color: var(--ink);
            font-size: 15px;
            letter-spacing: 0.3px;
            position: relative;
            padding-bottom: 4px;
        }

        nav a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0%;
            height: 1.5px;
            background-color: var(--lilac-deep);
            transition: width 0.3s ease;
        }

        nav a:hover {
            color: var(--khaki);
        }

        nav a:hover::after {
            width: 100%;
        }

        /* ---------- PORTADA ---------- */

        .hero {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 20px;
            position: relative;
            overflow: hidden;
        }

        .hero-thread {
            width: 1px;
            height: 46px;
            background: linear-gradient(to bottom, transparent, var(--khaki-soft));
            margin-bottom: 4px;
        }

        .hero-bead {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--lilac);
            margin-bottom: 22px;
            box-shadow: 0 0 0 5px var(--lilac-pale);
        }

        .hero-small {
            color: var(--khaki);
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 22px;
        }

        .hero h1 {
            font-size: clamp(64px, 11vw, 128px);
            letter-spacing: 6px;
            margin-bottom: 22px;
            font-weight: 600;
            color: var(--ink);
        }

        .hero p {
            font-size: 20px;
            color: var(--ink-soft);
            max-width: 560px;
            line-height: 1.7;
            margin-bottom: 42px;
            font-weight: 300;
        }

        .button {
            display: inline-block;
            background-color: var(--lilac-deep);
            color: #fffdf9;
            text-decoration: none;
            padding: 16px 38px;
            border-radius: 40px;
            font-size: 15px;
            letter-spacing: 0.4px;
            transition: 0.3s ease;
            box-shadow: 0 6px 18px rgba(164, 131, 201, 0.35);
        }

        .button:hover {
            background-color: var(--khaki);
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(140, 138, 86, 0.35);
        }

        /* ---------- DIVISOR ---------- */

        .divider {
            display: block;
            width: 100%;
            height: 28px;
            margin: 0 auto;
        }

        /* ---------- SECCIONES ---------- */

        section {
            padding: 100px 7%;
        }

        .section-title {
            text-align: center;
            margin-bottom: 70px;
            opacity: 0;
            transform: translateY(16px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }

        .section-title.in-view {
            opacity: 1;
            transform: translateY(0);
        }

        .section-title span {
            color: var(--lilac-deep);
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .section-title h2 {
            font-size: 42px;
            margin-top: 14px;
            font-weight: 500;
            color: var(--ink);
        }

        /* ---------- COLECCIÓN ---------- */

        .collection {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 36px 30px;
            max-width: 1100px;
            margin: auto;
        }

        .product {
            text-align: center;
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .product.in-view {
            opacity: 1;
            transform: translateY(0);
        }

        /* efecto "colgando": las piezas del medio bajan un poco, como pendientes desiguales */
        .product:nth-child(2),
        .product:nth-child(5) {
            transform: translateY(30px);
        }

        .product.in-view:nth-child(2),
        .product.in-view:nth-child(5) {
            transform: translateY(30px);
        }

        .product-thread {
            width: 1px;
            height: 22px;
            background-color: var(--khaki-soft);
            margin: 0 auto;
        }

        .product-image {
            height: 210px;
            width: 210px;
            margin: 0 auto 22px;
            background-color: var(--beige-deep);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50% 50% 46% 46% / 55% 55% 45% 45%;
            transition: transform 0.4s ease, border-radius 0.4s ease;
            overflow: hidden;
        }

        .product:hover .product-image {
            transform: translateY(-6px) rotate(-3deg);
            border-radius: 42% 58% 40% 60% / 55% 45% 55% 45%;
        }

        .product-image svg {
            width: 58%;
            height: auto;
            overflow: visible;
            transition: transform 0.4s ease;
